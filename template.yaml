                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${CoordinatorModelId}
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt Fn05Price.Arn
                - !GetAtt Fn05Financing.Arn
                - !GetAtt Fn05Delivery.Arn
                - !GetAtt Fn05Risk.Arn
                - !GetAtt Fn05Contract.Arn
      DurableConfig:
        ExecutionTimeout: 86400
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - coordinator.ts
        External:
          - '@aws-sdk/*'
        Banner:
