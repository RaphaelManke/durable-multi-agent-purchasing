AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Lambda durable functions step-by-step demo (stack dfdemo). One function per
  demo step, plus tracing variants of the coordinator and specialists.
  GENERATED by scripts/gen-template.ts. Do not edit by hand.

Parameters:
  CoordinatorModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: Bedrock model ID for the coordinator (uses global inference profile
      prefix automatically)
  SpecialistModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID for standard specialists (uses global inference
      profile prefix automatically)
  AdvancedSpecialistModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-6
    Description: Bedrock model ID for specialists needing stronger reasoning (e.g.
      risk-assessment)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64

Resources:
  # Step 01: two durable steps, the second fails once and is retried. No model.
  Fn01Retry:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dfdemo-01-retry
      CodeUri: src/steps/01-retry/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 30
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
      DurableConfig:
        ExecutionTimeout: 300
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - handler.ts
        External:
          - '@aws-sdk/*'
        Banner:
          - "js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

  # Step 02: adds context.wait. Wait time is not billed.
  Fn02Wait:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dfdemo-02-wait
      CodeUri: src/steps/02-wait/
      Handler: handler.handler
      MemorySize: 256
      Timeout: 30
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
      DurableConfig:
        ExecutionTimeout: 900
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - handler.ts
        External:
          - '@aws-sdk/*'
        Banner:
          - "js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

  # Step 03: model call A is replayed, not re-invoked, when model call B is retried.
  Fn03ModelReplay:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dfdemo-03-model-replay
      CodeUri: src/steps/03-model-replay/
      Handler: handler.handler
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          MODEL_ID: !Sub global.${SpecialistModelId}
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:*::foundation-model/${SpecialistModelId}
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${SpecialistModelId}
      DurableConfig:
        ExecutionTimeout: 900
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - handler.ts
        External:
          - '@aws-sdk/*'
        Banner:
          - "js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

  # Step 04: first Strands agent in one durable function.
  Fn04Agent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dfdemo-04-agent
      CodeUri: src/steps/04-agent/
      Handler: handler.handler
      MemorySize: 1024
      Timeout: 120
      Environment:
