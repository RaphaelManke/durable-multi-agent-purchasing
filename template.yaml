                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${SpecialistModelId}
      DurableConfig:
        ExecutionTimeout: 900
        RetentionPeriodInDays: 7
      AutoPublishAlias: live
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - handler.ts
        External:
          - '@aws-sdk/*'
        Banner:
